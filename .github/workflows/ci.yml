name: CI

on:
  push:
    branches: [ master, main, develop, 'fix/**', 'feature/**' ]
  pull_request:
    branches: [ master, main, develop ]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 1.24.x is the go.mod minimum; stable is the current release. (A
        # 1.23.x entry would silently auto-switch to the go.mod toolchain.)
        go-version: ['1.24.x', 'stable']

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: ${{ matrix.go-version }}
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Verify dependencies
      run: go mod verify

    - name: Run tests
      if: matrix.os != 'ubuntu-latest' || matrix.go-version != '1.24.x'
      run: go test -v ./...

    - name: Run tests with coverage
      if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.24.x'
      run: go test -v -race -coverprofile=coverage.txt -covermode=atomic ./...

    - name: Upload coverage to Codecov
      if: matrix.os == 'ubuntu-latest' && matrix.go-version == '1.24.x'
      uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
      with:
        files: ./coverage.txt
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: '1.24.x'
        cache: true

    - name: Run golangci-lint
      uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
      with:
        version: v2.6.2
        args: --timeout=5m

  fmt:
    name: Format Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: '1.24.x'

    - name: Check formatting
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "The following files are not formatted:"
          gofmt -s -l .
          exit 1
        fi

  vet:
    name: Go Vet
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: '1.24.x'
        cache: true

    - name: Run go vet
      run: go vet ./...

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    # Scanners run on the contributor's revision, so this job gets only read
    # access. SARIF upload (which needs security-events: write) lives in
    # security.yml, scoped to a single job on trusted refs.
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          # Declared minimum toolchain: enforce dependency advisories; stdlib
          # advisories are the consumer's toolchain concern and only reported.
          - go-version: '1.24.x'
            skip-stdlib: '1'
          # Current release: full enforcement including stdlib.
          - go-version: 'stable'
            skip-stdlib: '0'

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: ${{ matrix.go-version }}
        cache: true

    - name: Run govulncheck
      # Fails on any reachable advisory not explicitly accepted in
      # .govulncheck-ignore (see scripts/govulncheck-gate.sh).
      env:
        GOVULNCHECK_SKIP_STDLIB: ${{ matrix.skip-stdlib }}
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
        ./scripts/govulncheck-gate.sh

    - name: Run Gosec Security Scanner
      # Fails the job on findings; suppress individual false positives with
      # an annotated '#nosec' comment rather than globally.
      run: |
        go install github.com/securego/gosec/v2/cmd/gosec@v2.28.0
        gosec -quiet ./...

  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: '1.24.x'
        cache: true

    - name: Build all packages
      run: go build -v ./...

    - name: Build examples (if exist)
      run: |
        if [ -d "examples" ]; then
          for example in examples/*/; do
            if [ -f "$example/main.go" ]; then
              echo "Building $example"
              go build -v "$example"
            fi
          done
        fi

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || contains(github.ref, 'master') || contains(github.ref, 'main')

    steps:
    - name: Checkout code
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
    - name: Set up Go
      uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
      with:
        go-version: '1.24.x'
        cache: true

    - name: Run integration tests
      env:
        TEST_ZENON_RPC_URL: wss://my.hc1node.com:35998
      run: |
        # Run integration tests if they exist
        if go list ./... | grep -q integration; then
          go test -v -tags=integration ./...
        else
          echo "No integration tests found (expected in early development)"
        fi
