name: Security Scan

on:
  push:
    branches: [ main, master, develop, security/** ]
  pull_request:
    branches: [ main, master, develop ]
  schedule:
    # Run weekly on Monday at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch: # Allow manual triggering

# Least privilege by default. Only the gosec job, which uploads SARIF, is
# granted security-events: write (see below). Every checkout uses
# persist-credentials: false so third-party tools never see the workflow
# token through the git configuration.
permissions:
  contents: read

jobs:
  gosec:
    name: GoSec Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # For uploading SARIF results (this job only)
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.24.x'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run Gosec Security Scanner
        # Pinned to the v2.28.0 release commit. Dependabot/Renovate should bump
        # the SHA and the trailing version comment together.
        uses: securego/gosec@9e75c0576c9878035d4221392108d458abe10fc3 # v2.28.0
        with:
          args: '-fmt sarif -out gosec-results.sarif ./...'

      - name: Upload SARIF file
        # Forked PRs are not granted security-events: write; skip rather than
        # silently swallowing an authorization failure.
        if: always() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: gosec-results.sarif

  staticcheck:
    name: Staticcheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.24.x'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@v0.8.1

      - name: Run staticcheck
        run: staticcheck ./...

  govulncheck:
    name: Go Vulnerability Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          # Vulnerability scanning must run on a supported toolchain: stdlib
          # advisories are fixed only in current patch releases, so scanning
          # with an end-of-life Go line reports unfixable findings.
          go-version: 'stable'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Run govulncheck
        # Fails on any reachable advisory not explicitly accepted in
        # .govulncheck-ignore.
        run: ./scripts/govulncheck-gate.sh

  nancy:
    name: Nancy Dependency Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: '1.24.x'
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Write go.list for Nancy
        run: go list -json -deps ./... > go.list

      - name: Run Nancy (OSS Index)
        # Pinned to the v1.0.2 release commit.
        uses: sonatype-nexus-community/nancy-github-action@aae196481b961d446f4bff9012e4e3b63d7921a4 # v1.0.2
        continue-on-error: true # Advisory only; govulncheck is the enforced gate
        with:
          nancyCommand: sleuth --loud

  summary:
    name: Security Summary
    runs-on: ubuntu-latest
    needs: [gosec, staticcheck, govulncheck, nancy]
    if: always()
    steps:
      - name: Security scan summary
        run: |
          echo "## Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All security scans completed. Check job outputs for details." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Scans Performed" >> $GITHUB_STEP_SUMMARY
          echo "- GoSec: Static security analysis" >> $GITHUB_STEP_SUMMARY
          echo "- Staticcheck: Go best practices and bug detection" >> $GITHUB_STEP_SUMMARY
          echo "- Govulncheck: Known vulnerability detection" >> $GITHUB_STEP_SUMMARY
          echo "- Nancy: Dependency vulnerability scanning" >> $GITHUB_STEP_SUMMARY
